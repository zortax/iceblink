[workspace]
resolver = "3"
members = ["crates/*", "tool/*", "examples"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.90"
keywords = ["iceblink", "compositor", "gui", "wgpu", "rendering"]
categories = ["graphics", "gui"]

# Every dependency is declared here once, with its version and default features. Members name it
# with `workspace = true` and only add features.
[workspace.dependencies]
# Members, so that dependents outside this workspace can name them by path and version.
iceblink = { path = "crates/iceblink", version = "0.1.0" }
iceblink-alloc = { path = "crates/alloc", version = "0.1.0" }
iceblink-core = { path = "crates/core", version = "0.1.0" }
iceblink-driver = { path = "crates/driver", version = "0.1.0" }
iceblink-wgsl = { path = "crates/wgsl", version = "0.1.0" }
iceblink-wgpu = { path = "crates/wgpu", version = "0.1.0" }
iceblink-vello = { path = "crates/vello", version = "0.1.0" }
iceblink-cpu = { path = "crates/cpu", version = "0.1.0" }
iceblink-text = { path = "crates/text", version = "0.1.0" }
iceblink-testing = { path = "tool/testing", version = "0.1.0" }

# Versions match the lock of the frameworks that link these crates, so one copy of each is built.
bytemuck = { version = "1.25", features = ["derive"] }
smallvec = "1.15"
kurbo = "0.13.1"
rustc-hash = "2.1"
web-time = "1.1.0"
thiserror = "2.0.19"
tracing = "0.1.44"
etagere = "0.3"
futures = { version = "0.3", features = ["thread-pool"] }
# wgpu is pinned to 30.x because vello 0.11 links wgpu 30 and shares one device with the renderer.
wgpu = "30.0.2"
naga = "30.0.2"
bincode = "1.3"
vello = "0.11.0"
peniko = "0.6.1"
vello_cpu = { version = "0.3", default-features = false, features = ["std"] }
ash = "0.38"
windows = { version = "0.62", default-features = false, features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Security",
    "Win32_System_Threading",
] }
raw-window-handle = "0.6.2"
skrifa = "0.44.0"
swash = "0.2.10"
zeno = "0.3.3"
parley = "0.11.0"
fontique = "0.11.0"
winit = "0.30.13"
pollster = "0.4"
png = "0.17"
proptest = "1.11"
criterion = "0.8"

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "deny"
unreachable_pub = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
